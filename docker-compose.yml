version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ceph1386/panda-devops-app:latest
    container_name: panda-web-app
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
